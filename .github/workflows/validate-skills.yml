name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      # evals/ holds the eval cases and scripts/ their checker. Without these,
      # editing either would not re-run validation until the next skills/ change.
      - 'evals/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'evals/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for skill changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE"
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(skills|evals|scripts)/'; then
            echo "skills_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "skills_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.skills_changed == 'true'
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        if: steps.changes.outputs.skills_changed == 'true'
        # PyYAML is not a skills-ref dependency — the eval-case checker needs it.
        run: pip install skills-ref pyyaml

      - name: Validate all skills
        if: steps.changes.outputs.skills_changed == 'true'
        run: |
          exit_code=0
          for skill_dir in skills/*/; do
            echo "--- Validating ${skill_dir} ---"
            if ! python -m skills_ref.cli validate "$skill_dir"; then
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Validate eval cases
        # `claude plugin eval` is the real consumer of evals/<case>/case.yaml, but
        # it is gated behind early access, so its parser never runs in CI. Without
        # this, a malformed case merges unnoticed and only surfaces whenever
        # someone next runs the suite — an unknown key the strict grader schema
        # rejects, a regex that will not compile, a case named off its directory.
        #
        # Structure only. Nothing here executes a case, spawns an agent, or costs
        # tokens; whether the skill actually passes its evals is a separate
        # question that needs `claude plugin eval` and credentials.
        if: steps.changes.outputs.skills_changed == 'true'
        run: python scripts/check_eval_cases.py

      - name: Lint skills with agnix
        # Second opinion on spec conformance. skills-ref declares
        # `metadata: dict[str, str]` as a Python annotation with no runtime
        # check, so it passes type violations (e.g. an unquoted integer
        # version) that strict clients refuse to parse. Scoped to skills/ and
        # left non-strict on purpose: repo-wide, agnix also emits prose-style
        # heuristics about CLAUDE.md that should not gate a merge.
        #
        # Installed as a checksum-verified release binary because this repo
        # restricts Actions to GitHub-owned and verified creators.
        if: steps.changes.outputs.skills_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGNIX_VERSION: v0.49.0
          # Pinned digest — see the note in links.yml on why the release's own
          # .sha256 is not a sufficient integrity check.
          AGNIX_SHA256: e3bb9e3661025d54cc5d5835c429548d2a6e0626135363c41c044822f861bcbd
        run: |
          set -euo pipefail
          asset="agnix-x86_64-unknown-linux-gnu.tar.gz"
          dest="${RUNNER_TEMP}/agnix"
          mkdir -p "$dest"
          gh release download "$AGNIX_VERSION" --repo agent-sh/agnix \
            --pattern "$asset" --dir "$dest"
          echo "${AGNIX_SHA256}  ${dest}/${asset}" | sha256sum -c -
          tar xzf "$dest/$asset" -C "$dest"
          "$dest/agnix" --version
          "$dest/agnix" skills/ --target claude-code

      - name: Enforce version not manually changed
        if: steps.changes.outputs.skills_changed == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          exit_code=0
          changed_skills=$(git diff --name-only "$BASE_SHA" HEAD -- 'skills/' | cut -d'/' -f1-2 | sort -u)
          for skill_dir in $changed_skills; do
            skill_md="${skill_dir}/SKILL.md"
            if [ ! -f "$skill_md" ]; then
              continue
            fi
            head_version=$(awk '
              /^---/{fd++; next}
              fd==1 && /^metadata:/{m=1; next}
              fd==1 && m && /^[[:space:]]+version:/{match($0,/[0-9]+/); print substr($0,RSTART,RLENGTH); exit}
            ' "$skill_md")
            base_version=$(git show "${BASE_SHA}:${skill_md}" 2>/dev/null | awk '
              /^---/{fd++; next}
              fd==1 && /^metadata:/{m=1; next}
              fd==1 && m && /^[[:space:]]+version:/{match($0,/[0-9]+/); print substr($0,RSTART,RLENGTH); exit}
            ' || true)
            if [ -z "$base_version" ]; then
              # New skill — must have placeholder version 0
              if [ -z "$head_version" ]; then
                echo "::error file=${skill_md}::New skill has no metadata.version field — add 'metadata:' and '  version: 0' to the frontmatter"
                exit_code=1
              elif [ "$head_version" != "0" ]; then
                echo "::error file=${skill_md}::New skill must set metadata.version to 0 (CI assigns the real version on merge)"
                exit_code=1
              else
                echo "OK: ${skill_md} is a new skill with placeholder version 0"
              fi
            elif [ "$head_version" != "$base_version" ]; then
              echo "::error file=${skill_md}::metadata.version was manually changed (${base_version} -> ${head_version}). Version is managed by CI — do not edit it."
              exit_code=1
            else
              echo "OK: ${skill_md} version unchanged (${head_version})"
            fi
          done
          exit $exit_code

      - name: No skill changes
        if: steps.changes.outputs.skills_changed == 'false'
        run: echo "No changes in skills/, evals/ or scripts/, skipping validation."
