name: Send Codex PR Review
run-name: "Send Codex PR review for #${{ inputs.issue_number }} at ${{ inputs.head_sha }}"

# This workflow is deliberately separate from admission. One run equals one
# actual Codex request, so its run history is the global rate-limit ledger.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Pull request number to review
        required: true
        type: string
      head_sha:
        description: Head commit the review is requested for; admission uses it to skip duplicates
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  send-codex-review:
    name: Comment @codex review
    runs-on: ubuntu-latest
    steps:
      - name: Ensure comment token is configured
        env:
          GH_TOKEN_CODEX_COMMENT: ${{ secrets.GH_TOKEN_CODEX_COMMENT }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN_CODEX_COMMENT:-}" ]]; then
            echo '::error::GH_TOKEN_CODEX_COMMENT secret is not configured.'
            exit 1
          fi

      - name: Post Codex review request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          github-token: ${{ secrets.GH_TOKEN_CODEX_COMMENT }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            try {
              await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber,
              });
            } catch (error) {
              core.setFailed(`#${process.env.ISSUE_NUMBER} is not a pull request in this repository.`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '@codex review',
            });
