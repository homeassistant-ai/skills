name: HA Examples

on:
  # No path filter on pull requests: `ha-examples` is a required status check
  # on main, and a workflow that path filtering skips reports nothing, so the
  # check stays "expected" forever. The job runs on every PR and its "Check for
  # example changes" step skips the real work when none of its inputs changed.
  pull_request:
  schedule:
    # A Home Assistant release can remove an action, field or trigger key under
    # an example nobody touched, so check against the latest release weekly.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pull requests check against this tag, so a new Home Assistant release does
  # not fail an unrelated PR. Scheduled and manual runs check the latest
  # release; when one fails, fix the examples and bump this tag in that PR.
  HA_PINNED_TAG: "2026.9.3"

jobs:
  check:
    name: ha-examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for example changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Git matches the paths itself: a pattern on --name-only output
          # misses a path git prints quoted (one with a non-ASCII character).
          files=$(git diff --name-only "$PR_BASE_SHA" HEAD -- skills/ \
            scripts/check_ha_examples.py scripts/ha_examples_allowlist.yaml \
            .github/workflows/ha-examples.yml)
          if [ -n "$files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose the Home Assistant tag
        if: steps.changes.outputs.changed == 'true'
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tag="$HA_PINNED_TAG"
          else
            tag=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Checking against Home Assistant $tag"

      - name: Check out the Home Assistant definitions
        if: steps.changes.outputs.changed == 'true'
        # Only the files the checker reads: a few MB instead of the full tree.
        uses: actions/checkout@v7
        with:
          repository: home-assistant/core
          ref: ${{ steps.tag.outputs.tag }}
          path: ha-core
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /homeassistant/components/*/services.yaml
            /homeassistant/components/*/triggers.yaml
            /homeassistant/components/*/conditions.yaml
            /homeassistant/helpers/selector.py
            /homeassistant/const.py

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install pyyaml

      - name: Check example calls
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/check_ha_examples.py --ha-core ha-core

      - name: No example changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes to skills/ or the example checker, skipping."
