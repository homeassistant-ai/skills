schema_version: "1.1"
name: vacuum-last-clean
description: >
  A one-off derived value with no dedicated helper is the Template Helper's job.
  Checks the agent routes to the helper rather than a `template:` block in
  configuration.yaml.
tags: [templates, helpers, smoke]

execution:
  prompt: create a sensor that shows my vacuum's last clean time in a human-readable format
  allowed_tools: []
  max_turns: 10
  timeout_seconds: 300
runs: 3

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?home-assistant-best-practices"'
    min: 1

  - type: llm
    name: recommends-template-helper
    criteria: >-
      The response recommends creating a Template Helper — through the UI
      (Settings → Devices & Services → Helpers → Create Helper → Template) or a
      config-entry flow / API call — as the way to create this sensor.

      FAIL if the recommendation is to add a `template:` entry to
      configuration.yaml instead.

  - type: llm
    name: no-yaml-template-first
    criteria: >-
      The response does NOT lead with, or exclusively offer, writing `template:`
      YAML in configuration.yaml.

      FAIL if the first actionable instruction is to edit a YAML file, or if
      editing YAML is the only path offered.

  - type: llm
    name: no-yaml-platform-block
    criteria: >-
      The response does not present a YAML platform/template block as the thing to
      write — the helper is created through the UI or a config-entry flow.

      PASS if a YAML-shaped snippet appears but is labelled as the helper's config
      shape rather than a file to hand-edit. FAIL if the actionable instruction is
      to paste the block into a configuration file.

expected_outcome: >-
  Recommends creating a Template Helper (UI or config flow), not a `template:`
  block in configuration.yaml.
