schema_version: "1.1"
name: arrive-home-automation
description: >
  The obvious presence automation. Guards against the `entered_home` device
  trigger type, removed in 2026.5, which pre-2026.5 training data still suggests.
tags: [automations, triggers, version-pinned]

execution:
  prompt: >-
    create a Home Assistant automation that turns on light.living_room when I
    get home. I'm person.alex
  allowed_tools: [Read, Glob, Grep]
  model: sonnet
  max_turns: 10
  timeout_seconds: 300
runs: 3

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?home-assistant-best-practices"'
    min: 1

  # Free: a `state` trigger with `to: home`, a `zone.entered` trigger, or the
  # classic `zone` trigger, each followed by its home value within the same
  # trigger (300 characters). The pre-2024.10 `platform:` key counts too: this
  # checks the trigger type, not the syntax. The Sonnet judge ignored a "prose
  # counts" clause.
  - type: regex
    name: uses-state-trigger
    pattern: '^\s*-\s*(?:trigger|platform):\s*state\b[\s\S]{0,300}?\bto:\s*["'']?home\b|^\s*-\s*(?:trigger|platform):\s*(zone\.entered|zone)\b[\s\S]{0,300}?\bzone\.home\b'
    flags: m
    match: contains

  - type: llm
    name: no-entered-home-trigger
    criteria: >-
      The automation does NOT use the `entered_home` device trigger type, which was
      removed in Home Assistant 2026.5.

      Judge the automation the response tells the user to create. PASS if
      `entered_home` appears only in prose explaining that it was removed and must
      not be used. FAIL if it appears in a trigger block the user is told to use.

expected_outcome: >-
  A state trigger on a person or device_tracker entity with `to: home`. No
  `entered_home` device trigger.
