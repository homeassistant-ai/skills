schema_version: "1.1"
name: arrive-home-automation
description: >
  The obvious presence automation. Guards against the `entered_home` device
  trigger type, removed in 2026.5, which pre-2026.5 training data still suggests.
tags: [automations, triggers, version-pinned]

execution:
  prompt: create an automation that turns on the lights when I get home
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
runs: 3

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?home-assistant-best-practices"'
    min: 1

  - type: llm
    name: uses-state-trigger
    criteria: >-
      The automation triggers when a `person.*` or `device_tracker.*` entity
      arrives home: a `trigger: state` with `to: home`, or a `zone.entered`
      trigger that targets that entity with `zone.home`. A trigger the response
      describes in prose ("your person entity changes to `home`") counts the same
      as one written out in YAML.

      FAIL if the trigger is keyed on a device, or on anything other than a
      person or device_tracker entity arriving home.

  - type: llm
    name: no-entered-home-trigger
    criteria: >-
      The automation does NOT use the `entered_home` device trigger type, which was
      removed in Home Assistant 2026.5.

      Judge the automation the response tells the user to create. PASS if
      `entered_home` appears only in prose explaining that it was removed and must
      not be used. FAIL if it appears in a trigger block the user is told to use.

expected_outcome: >-
  A state trigger on a person or device_tracker entity with `to: home`. No
  `entered_home` device trigger.
