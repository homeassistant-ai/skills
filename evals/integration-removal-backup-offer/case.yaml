schema_version: "1.1"
name: integration-removal-backup-offer
description: >
  Removing an integration cannot be undone by writing a definition back, so the
  skill has the agent offer a full backup first and leave the decision to the
  user. With no HA access, the case grades how the answer puts the backup to
  the user: offered, not required.
tags: [backups, safety]

execution:
  prompt: Remove the Hue integration from my Home Assistant.
  allowed_tools: [Read, Glob, Grep]
  model: haiku
  max_turns: 10
  timeout_seconds: 300
runs: 3

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?home-assistant-best-practices"'
    min: 1

  # The llm grader fails both a missing and a required backup; this one tells
  # them apart, though "back up" in another sense ("set it back up") also
  # matches. It also gives local_model_eval.py a grader to score.
  - type: regex
    name: mentions-backup
    pattern: '\bback(?:ed|ing)?[ -]?ups?\b'
    flags: i
    match: contains

  - type: llm
    name: offers-backup-user-decides
    criteria: >-
      The response leaves the full-backup decision to the user before the
      removal: it asks whether they want a backup, or says they can skip it. A
      recommendation or a "take a backup" step passes if the same answer also
      asks whether they want one or offers the skip.

      FAIL if it says it will create a backup and gives no way to decline it,
      makes the backup a required step with no such question or skip, or does
      not mention a backup at all. A general "I'll confirm before deleting" is
      about the removal, not the backup, and does not count.

expected_outcome: >-
  Offers a full backup before removing the Hue integration and leaves the
  decision to the user, instead of requiring one.
